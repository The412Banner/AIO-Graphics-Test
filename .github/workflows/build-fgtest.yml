name: Build Bionic-FG Tester (Windows PE)

# Standalone frame-generation validation harness. A single self-contained .exe
# (src/fgtest.c) with no dependency on the main AIO suite - it is the ground-truth
# frame *source* for proving the Bionic-FG Vulkan layer works (see
# docs/FRAMEGEN_TEST.md and tools/fg_analyze.py).

on:
  workflow_dispatch:
  push:
    branches: [ main, 'feat/**' ]
    paths:
      - 'src/fgtest.c'
      - '.github/workflows/build-fgtest.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # 64-bit: loads the container's x64 DXVK d3d11.dll at runtime.
          - arch: x86_64
            prefix: x86_64-w64-mingw32
            apt: gcc-mingw-w64-x86-64
            out: AIO-FGTest-64bit.exe
            artifact: fgtest-64bit
          # 32-bit: loads the container's x32 DXVK d3d11.dll - the bitness most
          # legacy DirectX titles run as.
          - arch: i686
            prefix: i686-w64-mingw32
            apt: gcc-mingw-w64-i686
            out: AIO-FGTest-32bit.exe
            artifact: fgtest-32bit
    name: build-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ${{ matrix.apt }}

      - name: Compile + link ${{ matrix.out }}
        run: |
          # d3d11.dll and d3dcompiler are LoadLibrary'd at runtime, so we link no
          # import libs for them - only Win32 system libs the source calls directly:
          #   gdi32/user32 (window), dxguid (IID_ID3D11Texture2D), winmm (timeBeginPeriod).
          ${{ matrix.prefix }}-gcc src/fgtest.c \
            -I src \
            -DWIN32_LEAN_AND_MEAN -D_WIN32_WINNT=0x0A00 \
            -O2 -mwindows \
            -o ${{ matrix.out }} \
            -luser32 -lgdi32 -ldxguid -lwinmm
          file ${{ matrix.out }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIO-FGTest-${{ matrix.artifact }}
          path: ${{ matrix.out }}
